
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heatmap Isolation Test</title>
    <style>
        body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
        #container { width: 100vw; height: 100vh; display: flex; }
        #canvas-container { flex: 1; position: relative; }
        #controls { width: 300px; padding: 20px; background: #222; border-left: 1px solid #333; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #888; }
        input { width: 100%; background: #333; border: 1px solid #444; color: white; padding: 5px; }
        canvas { border: 1px solid #444; }
    </style>
    <!-- Import Map for Three.js ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        <div id="controls">
            <h2>Heatmap Debugger</h2>
            <div class="control-group">
                <label>Pixels Per Meter</label>
                <input type="number" id="ppm" value="40">
            </div>
            <div class="control-group">
                <label>Light Lumens</label>
                <input type="number" id="lumens" value="800">
            </div>
             <div class="control-group">
                <label>Light Height (m)</label>
                <input type="number" id="height" value="2.74">
            </div>
            <div class="control-group">
                <label>Generated Texture Preview</label>
                <canvas id="debug-canvas"></canvas>
            </div>
            <button id="update-btn" style="width:100%; padding: 10px; background: #3b82f6; border: none; color: white; cursor: pointer;">Update Heatmap</button>
            <div id="stats" style="margin-top: 20px; font-family: monospace; font-size: 12px;"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { generateHeatmapTexture } from './renderer.js';

        // 1. Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(window.innerWidth / -2, window.innerWidth / 2, window.innerHeight / 2, window.innerHeight / -2, 1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth - 300, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. Create Room (Polygon)
        const roomPoints = [
            { x: -200, y: -200 },
            { x: 200, y: -200 },
            { x: 200, y: 200 },
            { x: -200, y: 200 }
        ];

        const shape = new THREE.Shape();
        shape.moveTo(roomPoints[0].x, roomPoints[0].y);
        for(let i=1; i<roomPoints.length; i++) shape.lineTo(roomPoints[i].x, roomPoints[i].y);
        shape.closePath();

        const geometry = new THREE.ShapeGeometry(shape);
        // Base material (blue tint)
        const material = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.1, side: THREE.DoubleSide });
        const roomMesh = new THREE.Mesh(geometry, material);
        scene.add(roomMesh);

        // Heatmap Mesh (Overlay)
        const heatmapMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.8, side: THREE.DoubleSide });
        const heatmapMesh = new THREE.Mesh(geometry, heatmapMat);
        heatmapMesh.position.z = 1;
        scene.add(heatmapMesh);

        // 3. Create Light (Visual Marker)
        const lightMarker = new THREE.Mesh(
            new THREE.CircleGeometry(10, 32),
            new THREE.MeshBasicMaterial({ color: 0xffff00 })
        );
        scene.add(lightMarker);

        // State
        const state = {
            lightPos: { x: 0, y: 0 },
            lumens: 800,
            height: 2.74,
            ppm: 40
        };

        // Draggable Light Logic
        let isDragging = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', (e) => {
            if(e.clientX < window.innerWidth - 300) isDragging = true;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if(isDragging) {
                // simple screen to world for ortho
                const rect = renderer.domElement.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width/2;
                const y = -(e.clientY - rect.top - rect.height/2); // Y inverted in Three
                state.lightPos.x = x * (1/camera.zoom); // Assuming zoom 1 for now
                state.lightPos.y = y * (1/camera.zoom);
                lightMarker.position.set(state.lightPos.x, state.lightPos.y, 2);
                update();
            }
        });

        // 4. Update Logic
        async function update() {
            const canvas = document.getElementById('debug-canvas');
            const ppm = parseFloat(document.getElementById('ppm').value);
            
            const roomData = { points: roomPoints };
            const fixtures = [{
                x: state.lightPos.x,
                y: state.lightPos.y,
                installationHeight: parseFloat(document.getElementById('height').value),
                metadata: { lumens: parseFloat(document.getElementById('lumens').value) }
            }];

            const result = generateHeatmapTexture(canvas, roomData, fixtures, ppm);

            // Apply texture to mesh
            const texture = new THREE.CanvasTexture(canvas);
            
            // APPLY UV MAPPING FIX
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(result.textureParams.repeatX, result.textureParams.repeatY);
            texture.offset.set(result.textureParams.offsetX, result.textureParams.offsetY);
            
            heatmapMesh.material.map = texture;
            heatmapMesh.material.needsUpdate = true;

            // Stats
            document.getElementById('stats').innerText = 
                `Light Pos: ${state.lightPos.x.toFixed(0)}, ${state.lightPos.y.toFixed(0)}\n` +
                `UV Repeat: ${result.textureParams.repeatX.toFixed(4)}, ${result.textureParams.repeatY.toFixed(4)}\n` +
                `UV Offset: ${result.textureParams.offsetX.toFixed(4)}, ${result.textureParams.offsetY.toFixed(4)}`;
        }

        document.getElementById('update-btn').addEventListener('click', update);
        
        // Init
        lightMarker.position.set(0,0,2);
        update();

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
